x-api-image: &api-image
  build:
    context: .
    dockerfile: Dockerfile
  image: wow-helper-api

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *api-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["bun", "run", "db:migrate"]

  api:
    <<: *api-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *api-image
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      WOWHEAD_POLL_CRON: "${WOWHEAD_POLL_CRON:-0 */5 * * * *}"
    ports:
      - "127.0.0.1:${WORKER_PORT:-3001}:3001"
    command: ["bun", "run", "start:worker"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: wow-helper-victoria-logs
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=7d
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - victoria_logs_data:/victoria-logs-data

  vector:
    image: timberio/vector:0.58.0-debian
    container_name: wow-helper-vector
    restart: unless-stopped
    depends_on:
      - victoria-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml

volumes:
  postgres_data:
  victoria_logs_data:

configs:
  vector_config:
    content: |
      sources:
        docker:
          type: docker_logs
          exclude_containers:
            - wow-helper-vector
            - wow-helper-victoria-logs

      transforms:
        parse_json:
          type: remap
          inputs:
            - docker
          source: |
            parsed, err = parse_json(.message)
            if err == null && is_object(parsed) {
              . = merge!(., parsed)
              if is_string(.msg) {
                .message = .msg
              }
            }

      sinks:
        victoria_logs:
          type: elasticsearch
          inputs:
            - parse_json
          endpoints:
            - http://victoria-logs:9428/insert/elasticsearch/
          mode: bulk
          api_version: v8
          compression: gzip
          healthcheck:
            enabled: false
          query:
            _msg_field: message
            _time_field: timestamp
            _stream_fields: host,container_name
